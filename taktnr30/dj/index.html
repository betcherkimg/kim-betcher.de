<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0c">
<title>DJ – TAKT Nr. 30</title>
<link rel="icon" href="/taktnr30/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/taktnr30/assets/takt.css?v=1">
<style>
  body { padding: 28px 0 64px; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .top img { width: 44px; }
  .top span { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; color: var(--dim); }
  .paper { background: #fbfaf7; color: #16161c; border-radius: 10px; padding: clamp(20px, 5vw, 40px); font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 16.5px; line-height: 1.6; }
  .paper h1 { font-family: var(--sans); font-weight: 600; font-size: 24px; line-height: 1.25; margin: 0 0 14px; text-wrap: balance; }
  .paper h2 { font-family: var(--sans); font-weight: 600; font-size: 17px; margin: 24px 0 6px; }
  .paper p { margin: 0 0 10px; }
  .paper ol, .paper ul { margin: 0 0 10px; padding-left: 24px; }
  .paper li { margin: 0 0 6px; }
  .paper strong { font-weight: 700; }
  .step { margin-top: 28px; }
  .step h2 { font-weight: 400; font-size: 20px; margin: 0 0 6px; }
  .annex { display: grid; gap: 8px; }
  .annex .r { display: grid; grid-template-columns: 1.6fr 1fr 90px 34px; gap: 6px; }
  .annex input { min-height: 44px; font-size: 15px; padding: 8px 10px; }
  .annex .x { background: none; border: 1px solid var(--line-2); color: var(--muted); border-radius: var(--radius); cursor: pointer; }
  @media (max-width: 560px) {
    .annex .r { grid-template-columns: 1fr 1fr 40px; grid-template-areas: "item item x" "serial value value"; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .annex .r input:nth-child(1) { grid-area: item; } .annex .r input:nth-child(2) { grid-area: serial; } .annex .r input:nth-child(3) { grid-area: value; } .annex .r .x { grid-area: x; }
  }
  .eqtable { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
  .eqtable td, .eqtable th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e3e1db; } .eqtable th { font-family: var(--sans); font-size: 12px; letter-spacing: .08em; color: #6d6d78; } .eqtable .v { text-align: right; white-space: nowrap; }
  .padwrap { background: #fbfaf7; border-radius: 10px; position: relative; margin-top: 10px; }
  .padwrap canvas { display: block; width: 100%; height: 190px; border-radius: 10px; cursor: crosshair; }
  .padwrap .base { position: absolute; left: 20px; right: 20px; bottom: 46px; border-bottom: 1.5px solid #9a9aa6; pointer-events: none; }
  .padwrap .hint { position: absolute; left: 20px; right: 20px; bottom: 18px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: #8a8a96; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sigs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  .sig { background: #fbfaf7; color: #16161c; border-radius: 10px; padding: 14px; min-width: 0; }
  .sig small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: #6d6d78; text-transform: uppercase; }
  .sig img { height: 64px; width: auto; max-width: 100%; margin: 8px 0; object-fit: contain; }
  .sig b { display: block; font-family: var(--sans); font-weight: 600; }
  .sig span { font-size: 13px; color: #55555f; }
  @media (max-width: 480px) { .sigs { grid-template-columns: 1fr; } }
  .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .done { border: 1px solid var(--ok); border-radius: 10px; padding: 16px 18px; margin-top: 22px; }
  .sha { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; margin-top: 10px; }

  .form { display: grid; gap: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .fld span { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; }
  .fld small { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .fld input, .fld select { width: 100%; min-height: 46px; font-size: 16px; }
  .box { border: 1px solid var(--line-2); border-radius: 10px; padding: 16px; margin-top: 18px; }
  .box h2 { font-weight: 400; font-size: 19px; margin: 0 0 4px; }
  .box p.note, p.note { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .guests { display: grid; gap: 8px; }
  .guests input { min-height: 44px; font-size: 15px; padding: 8px 10px; }
  .guests .r { display: grid; grid-template-columns: 1fr 1fr 34px; gap: 6px; }
  .guests .x { background: none; border: 1px solid var(--line-2); color: var(--muted); border-radius: var(--radius); cursor: pointer; }
  @media (max-width: 560px) { .guests .r { grid-template-columns: 1fr 40px; } .guests .r input:nth-child(2) { grid-column: 1; } .guests .r .x { grid-row: 1; grid-column: 2; } }
  .err { color: var(--bad, #ff6b6b); }
  .lead { font-size: 17px; line-height: 1.55; color: var(--muted); margin: 0 0 6px; }
  h1.big { font-weight: 300; font-size: clamp(28px, 7vw, 40px); margin: 0 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/taktnr30/assets/logo.svg" alt=""><span>TAKT NR. 30 · DJ</span></div>
  <div id="box"><p class="muted">Wird geladen …</p></div>
</div>
<script src="/taktnr30/assets/takt.js?v=2"></script>
<script defer src="/taktnr30/assets/vendor/jspdf.umd.min.js"></script>
<script src="/taktnr30/assets/contract.js?v=1"></script>
<script>
(function () {
  "use strict";
  const { api, esc, $, dateDe } = TAKT;
  const { renderHtml, SignPad } = TAKT_CONTRACT;
  const code = (new URLSearchParams(location.search).get("c") || "").replace(/[^A-Za-z0-9]/g, "");
  let MAX_GUESTS = 2;
  let ev = null, form = { annex: [], guests: [] }, draft = null, photo = null;

  const val = id => ($("#" + id)?.value || "").trim();
  const showErr = (m) => { const e = $("#err"); e.textContent = m; e.hidden = !m; if (m) e.scrollIntoView({ behavior: "smooth", block: "center" }); };

  function eqRow(a = {}) {
    return `<div class="r"><input class="input" placeholder="Gerät (z. B. Pioneer CDJ-3000)" value="${esc(a.item || "")}" maxlength="80" aria-label="Gerät"><input class="input" placeholder="Seriennummer" value="${esc(a.serial || "")}" maxlength="60" aria-label="Seriennummer"><input class="input" placeholder="Wert €" inputmode="decimal" value="${esc(a.value || "")}" maxlength="12" aria-label="Wert in Euro"><button class="x" type="button" aria-label="Zeile entfernen">✕</button></div>`;
  }
  function guestRow(g = {}) {
    return `<div class="r"><input class="input" placeholder="Vor- und Nachname" value="${esc(g.name || "")}" maxlength="80" aria-label="Name des Gastes" autocomplete="off"><input class="input" type="email" placeholder="E-Mail" value="${esc(g.email || "")}" maxlength="160" aria-label="E-Mail des Gastes" autocomplete="off"><button class="x" type="button" aria-label="Gast entfernen">✕</button></div>`;
  }
  const bindX = host => host.querySelectorAll(".x").forEach(b => b.onclick = () => { b.parentElement.remove(); guestBtn(); });
  const guestBtn = () => { const b = $("#addGuest"); if (b) b.hidden = $("#guests").children.length >= MAX_GUESTS; };

  function step1() {
    const f = form;
    $("#box").innerHTML = `
      <h1 class="big">Schön, dass du auflegst.</h1>
      <p class="lead">TAKT Nr. 30 · ${esc(ev.weekday)}, ${esc(dateDe(ev.event_date))} · ${esc(ev.venue)}, ${esc(ev.venue_address)}</p>
      <p class="note">Trag hier ein, was wir abgesprochen haben. Daraus entsteht dein Vertrag, den du dir im nächsten Schritt durchliest und mit dem Finger unterschreibst. Die genaue Uhrzeit deines Sets klären wir direkt miteinander – die steht nicht im Vertrag.</p>

      <div class="box"><h2>Über dich</h2>
        <div class="form">
          <label class="fld"><span>Künstlername</span><input class="input" id="artist" value="${esc(f.artist || "")}" maxlength="60" placeholder="so, wie er im Line-up stehen soll"></label>
          <label class="fld"><span>Hörprobe (Link, optional)</span><input class="input" id="hear_link" type="url" value="${esc(f.hear_link || "")}" maxlength="300" placeholder="https://soundcloud.com/…"></label>
          <div class="fld"><span>Foto fürs Line-up (optional)</span>
            <div style="display:flex;gap:12px;align-items:center"><img id="photoPrev" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;${photo ? "" : "display:none"}" src="${photo || ""}">
            <label class="btn btn-small" style="cursor:pointer">${photo ? "Anderes Foto" : "Foto wählen"}<input type="file" id="photo" accept="image/*" hidden></label></div>
            <small>Am besten ein Bild, das dir gefällt – es erscheint rund im Line-up.</small></div>
          <div class="two"><label class="fld"><span>Vorname</span><input class="input" id="first_name" value="${esc(f.first_name || "")}" maxlength="60" autocomplete="given-name"></label>
          <label class="fld"><span>Nachname</span><input class="input" id="last_name" value="${esc(f.last_name || "")}" maxlength="60" autocomplete="family-name"></label></div>
          <label class="fld"><span>Straße und Hausnummer</span><input class="input" id="street" value="${esc(f.street || "")}" maxlength="100" autocomplete="street-address"></label>
          <label class="fld"><span>PLZ und Ort</span><input class="input" id="city" value="${esc(f.city || "")}" maxlength="80" placeholder="89518 Heidenheim"></label>
          <div class="two"><label class="fld"><span>E-Mail</span><input class="input" id="email" type="email" value="${esc(f.email || "")}" maxlength="160" autocomplete="email"><small>Hierhin kommen Vertrag und Ticket.</small></label>
          <label class="fld"><span>Handynummer</span><input class="input" id="phone" type="tel" value="${esc(f.phone || "")}" maxlength="40" autocomplete="tel"></label></div>
        </div></div>

      <div class="box"><h2>Set und Gage</h2>
        <div class="form">
          <div class="two"><label class="fld"><span>Set-Länge</span><select class="input" id="set_length">${[60, 90, 120, 150, 180, 240].map(m => `<option value="${m} min"${String(f.set_length) === `${m} min` || (!f.set_length && m === 120) ? " selected" : ""}>${lenLabel(m)}</option>`).join("")}</select></label>
          <label class="fld"><span>Wunsch-Beginn (optional)</span><select class="input" id="wish_time"></select><small>Nur freie Zeiten. Die genaue Uhrzeit klärt ihr noch miteinander.</small></label></div>
          <label class="fld"><span>Ankunft ca. (optional)</span><input class="input" id="arrival" type="time" value="${esc(f.arrival || "")}"><small>Wann du zum Aufbauen oder für einen Soundcheck da sein willst.</small></label>
          <div class="two"><label class="fld"><span>Festpreis (€)</span><input class="input" id="price" inputmode="decimal" value="${esc(f.price || "")}" maxlength="12" placeholder="z. B. 200"><small>Fester Gesamtpreis – Anfahrt und alle Kosten sind inklusive. 0, wenn du ohne Gage spielst.</small></label>
          <label class="fld"><span>Kontoinhaber</span><input class="input" id="holder" value="${esc(f.holder || "")}" maxlength="80" autocomplete="cc-name"></label></div>
          <div class="two"><label class="fld"><span>IBAN</span><input class="input" id="iban" value="${esc(f.iban || "")}" maxlength="42" autocomplete="off" inputmode="text" placeholder="DE…"></label><span></span></div>
          <p class="note">Die Gage überweist Kim bis spätestens ${esc(dateDe(ev.pay_until))}.</p>
        </div></div>

      <div class="box"><h2>Dein Equipment</h2>
        <p class="note">Alles, was du mitbringst – mit Wert, damit es während der Veranstaltung über Kims Veranstalterversicherung gegen Sachschäden versichert ist. Lautsprecher, Licht und Strom sind vor Ort.</p>
        <div class="annex" id="annex"></div>
        <div class="acts"><button class="btn btn-small" id="addEq" type="button">+ Gerät</button></div></div>

      <div class="box"><h2>Möchtest du noch jemanden auf die Gästeliste setzen?</h2>
        <p class="note">Bis zu ${MAX_GUESTS} Personen. Jeder bekommt sein eigenes Ticket per E-Mail.</p>
        <div class="guests" id="guests"></div>
        <div class="acts"><button class="btn btn-small" id="addGuest" type="button">+ Gast</button></div></div>

      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn btn-uv btn-block" id="next" style="margin-top:18px">Weiter zum Vertrag</button>`;
    $("#annex").innerHTML = (f.annex.length ? f.annex : [{}, {}]).map(eqRow).join(""); bindX($("#annex"));
    $("#guests").innerHTML = f.guests.map(guestRow).join(""); bindX($("#guests")); guestBtn();
    $("#addEq").onclick = () => { $("#annex").insertAdjacentHTML("beforeend", eqRow()); bindX($("#annex")); };
    $("#addGuest").onclick = () => { if ($("#guests").children.length >= MAX_GUESTS) return; $("#guests").insertAdjacentHTML("beforeend", guestRow()); bindX($("#guests")); guestBtn(); $("#guests").lastElementChild.querySelector("input").focus(); };
    $("#next").onclick = next;
    $("#set_length").onchange = () => fillWish($("#wish_time").value);
    // Foto im Browser verkleinern (max. 800 px, JPEG) – dann ist es klein genug zum Hochladen
    $("#photo").onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(file); });
        const k = Math.min(1, 800 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        collect(); photo = cv.toDataURL("image/jpeg", 0.85); step1();
      } catch { showErr("Das Bild konnte nicht gelesen werden. Bitte ein anderes wählen."); }
    };
    fillWish(f.wish_time || "");
  }

  // Wunsch-Beginn: alle halbe Stunde, belegte Zeiten (Line-up, andere DJs) sind ausgegraut
  const lenLabel = m => m === 60 ? "1 Stunde" : `${(m / 60).toLocaleString("de-DE")} Stunden`;
  const hhmm = n => { const t = (n + 720) % 1440; return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`; };
  function fillWish(keep) {
    const len = parseInt($("#set_length").value, 10) || 120;
    const opts = ['<option value="">egal / noch offen</option>'];
    for (let n = ev.first; n + len <= ev.last_end; n += 30) {
      const busy = ev.taken.some(([a, z]) => n < z && n + len > a);
      const t = hhmm(n);
      opts.push(`<option value="${t}"${busy ? " disabled" : ""}${t === keep && !busy ? " selected" : ""}>${t} – ${hhmm(n + len)} Uhr${busy ? " · belegt" : ""}</option>`);
    }
    $("#wish_time").innerHTML = opts.join("");
  }

  function collect() {
    form = {
      artist: val("artist"), hear_link: val("hear_link"), arrival: val("arrival"), first_name: val("first_name"), last_name: val("last_name"), street: val("street"), city: val("city"),
      email: val("email"), phone: val("phone"), set_length: val("set_length"), wish_time: val("wish_time"), price: val("price"), holder: val("holder"), iban: val("iban"),
      annex: [...$("#annex").querySelectorAll(".r")].map(r => { const i = r.querySelectorAll("input"); return { item: i[0].value.trim(), serial: i[1].value.trim(), value: i[2].value.trim() }; }).filter(a => a.item),
      guests: [...$("#guests").querySelectorAll(".r")].map(r => { const i = r.querySelectorAll("input"); return { name: i[0].value.trim().replace(/\s+/g, " "), email: i[1].value.trim() }; }).filter(g => g.name || g.email)
    };
  }

  async function next() {
    collect(); showErr("");
    const btn = $("#next"); btn.disabled = true; btn.textContent = "Vertrag wird erstellt …";
    try { draft = await api("/public/dj/preview", { method: "POST", body: { c: code, form } }); step2(); window.scrollTo({ top: 0 }); }
    catch (e) { showErr(e.message); btn.disabled = false; btn.textContent = "Weiter zum Vertrag"; }
  }

  function step2() {
    const eq = draft.annex.length ? `<table class="eqtable"><thead><tr><th>Gerät</th><th>Seriennr.</th><th class="v">Wert €</th></tr></thead><tbody>${draft.annex.map(a => `<tr><td>${esc(a.item)}</td><td>${esc(a.serial || "–")}</td><td class="v">${esc(a.value || "")}</td></tr>`).join("")}</tbody></table>` : "";
    $("#box").innerHTML = `<p class="note">Lies dir den Vertrag in Ruhe durch. Stimmt etwas nicht, geh zurück und ändere es.</p>
      <article class="paper">${renderHtml(draft.body)}${eq}</article>
      <div class="acts"><button class="btn btn-small" id="back" type="button">← Zurück und ändern</button></div>
      <section class="step"><h2>Unterschreiben</h2>
        <label class="check"><input type="checkbox" id="accept"><span>Ich habe den Vertrag gelesen und bin einverstanden.</span></label>
        <div class="padwrap"><canvas id="pad" aria-label="Unterschriftenfeld"></canvas><div class="base"></div><div class="hint">MIT DEM FINGER · ${esc((form.first_name + " " + form.last_name).toUpperCase())}</div></div>
        <div class="acts"><button class="btn btn-small" id="clear" type="button">Löschen</button></div>
        <p class="err" id="err" role="alert" hidden></p>
        <button class="btn btn-uv btn-block" id="sign" style="margin-top:16px">Unterschreiben und abschicken</button>
      </section>`;
    $("#back").onclick = () => { step1(); window.scrollTo({ top: 0 }); };
    const pad = SignPad($("#pad"));
    $("#clear").onclick = () => pad.clear();
    $("#sign").onclick = async () => {
      showErr("");
      if (!$("#accept").checked) return showErr("Bitte bestätige, dass du den Vertrag gelesen hast.");
      const sig = pad.empty() ? null : pad.toDataURL();
      if (!sig) return showErr("Bitte im weißen Feld unterschreiben.");
      const btn = $("#sign"); btn.disabled = true; btn.textContent = "Wird gespeichert …";
      try {
        const r = await api("/public/dj/sign", { method: "POST", body: { c: code, form, sig, accept: true, body_sha: draft.body_sha, photo } });
        step3(r.url);
      } catch (e) { showErr(e.message); btn.disabled = false; btn.textContent = "Unterschreiben und abschicken"; }
    };
  }

  function step3(url) {
    window.scrollTo({ top: 0 });
    $("#box").innerHTML = `<h1 class="big">Danke, ${esc(form.first_name)}!</h1>
      <div class="done"><strong>Unterschrieben und abgeschickt.</strong> Kim unterschreibt jetzt noch. Danach bekommst du per E-Mail an ${esc(form.email)}:
        <ul style="margin:10px 0 0;padding-left:20px"><li>den Vertrag mit beiden Unterschriften als PDF</li><li>dein Ticket (das Papierticket kommt per Post)</li>${form.guests.length ? `<li>${form.guests.length === 1 ? "deinen Gast" : "deine Gäste"} bekommen ihr Ticket direkt per E-Mail</li>` : ""}</ul></div>
      <p class="note" style="margin-top:16px">Deinen Vertrag kannst du jederzeit hier ansehen: <a href="${esc(url)}">Vertrag öffnen</a>. Die Uhrzeit deines Sets klärt ihr direkt miteinander.</p>`;
  }

  (async () => {
    if (!code) { $("#box").innerHTML = `<p class="err">Der Link ist unvollständig. Bitte den ganzen Link aus der Nachricht öffnen.</p>`; return; }
    try { ev = await api(`/public/dj?c=${encodeURIComponent(code)}`); MAX_GUESTS = ev.max_guests || MAX_GUESTS; step1(); }
    catch (e) { $("#box").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  })();
})();
</script>
</body>
</html>
