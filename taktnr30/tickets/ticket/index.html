<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TAKT Nr. 30">
<title>Dein Ticket – TAKT Nr. 30</title>
<link rel="icon" href="/taktnr30/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/taktnr30/assets/takt.css?v=1">
<style>
  body { padding: 28px 0 56px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top a { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-decoration: none; color: var(--dim); }
  .tickets { display: grid; gap: 28px; }
  .ticket { max-width: 380px; width: 100%; margin: 0 auto; background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px 0; text-align: center; position: relative; overflow: hidden; }
  .ticket.cat-free { border-top: 3px solid var(--uv-soft); }
  .ticket.cat-helper { border-top: 3px solid var(--ok); }
  .ticket .logo { width: 64px; margin: 0 auto; }
  .ticket .wm { width: 190px; margin: 12px auto 0; }
  .qrwrap { margin: 22px auto 0; width: 236px; height: 236px; border-radius: 50%; border: 1px solid var(--uv); display: flex; align-items: center; justify-content: center; }
  .qrwrap .qr { width: 150px; height: 150px; padding: 8px; background: #fff; border-radius: 6px; }
  .ticket .name { margin-top: 22px; font-size: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; text-align: left; margin-top: 20px; }
  .grid dt { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--dim); }
  .grid dd { margin: 2px 0 0; font-family: var(--mono); font-size: 14px; }
  .addr { grid-column: 1 / -1; }
  .stubtext { padding: 16px 0 20px; font-family: var(--mono); font-size: 11px; letter-spacing: .26em; color: var(--muted); text-transform: uppercase; }
  .ticket .stub { margin: 22px -24px 0; }
  .ticket .stub::before, .ticket .stub::after { background: var(--bg); }
  .flag { position: absolute; top: 16px; right: -36px; transform: rotate(35deg); width: 150px; padding: 4px 0; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; }
  .flag.test { background: var(--warn); color: #1a1300; }
  .flag.bad { background: var(--bad); color: #fff; }
  .flag.in { background: var(--ok); color: #04210f; }
  .void .qrwrap { opacity: .25; filter: grayscale(1); }
  .actions { max-width: 380px; margin: 18px auto 0; display: grid; gap: 10px; }
  .hint { max-width: 380px; margin: 26px auto 0; font-size: 14px; color: var(--dim); text-align: center; }
  /* Schichtwahl (nur Helfer) */
  .crew { max-width: 380px; margin: 30px auto 0; scroll-margin-top: 16px; }
  .crew h2 { font-weight: 300; font-size: 24px; margin: 0 0 6px; }
  .crew .lead { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 6px; }
  .crew .perk { display: flex; gap: 10px; align-items: center; margin: 14px 0 18px; padding: 12px 14px; border: 1px solid rgba(25,195,125,.45); background: rgba(25,195,125,.08); border-radius: 12px; font-size: 14px; line-height: 1.45; }
  .crew .perk b { color: var(--ok); font-weight: 600; }
  .crew .count { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--dim); margin: 0 0 10px; display: flex; justify-content: space-between; }
  .crew .count b { color: var(--ok); font-weight: 500; }
  .slot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-2); margin-bottom: 10px; }
  .slot .t { font-family: var(--mono); font-size: 17px; }
  .slot .w { font-size: 13px; color: var(--dim); grid-column: 1; }
  .slot .w .who { color: var(--muted); }
  .slot button { grid-row: 1 / span 2; grid-column: 2; min-width: 104px; min-height: 44px; border-radius: 99px; border: 1px solid var(--line-2); background: transparent; color: var(--ink); font: 600 14px var(--sans); letter-spacing: .04em; cursor: pointer; }
  .slot button.take { background: var(--ok); border-color: var(--ok); color: #04210f; }
  .slot button:disabled { opacity: .45; cursor: default; }
  .slot.mine { border-color: var(--ok); background: rgba(25,195,125,.07); }
  .slot.mine .t::after { content: "  ✓ deine"; font-family: var(--sans); font-size: 13px; color: var(--ok); }
  .slot.off { opacity: .55; }
  .slot.off button:not(:disabled) { opacity: 1; }
  .slot .bar { grid-column: 1 / -1; display: flex; gap: 4px; margin-top: 6px; }
  .slot .bar i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
  .slot .bar i.on { background: var(--ok); }
  .crew .grp { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--dim); margin: 18px 0 8px; }
  .recruit { margin-top: 26px; padding: 18px 16px; border: 1px dashed var(--line-2); border-radius: 14px; }
  .recruit h3 { margin: 0 0 6px; font-weight: 400; font-size: 19px; }
  .recruit p { margin: 0 0 14px; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .recruit .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .recruit .row .btn { min-height: 48px; white-space: nowrap; padding-left: 8px; padding-right: 8px; letter-spacing: .1em; }
  .recruit small { display: block; margin-top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--dim); }
  .commit { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; padding: 14px; border: 1px solid var(--line-2); border-radius: 12px; margin: 0 0 14px; font-size: 15px; line-height: 1.45; cursor: pointer; }
  .commit input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); }
  .commit.need { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(255,194,61,.25); }
  .commit.done { border-color: rgba(25,195,125,.45); color: var(--muted); }
  .slot .cfm { grid-column: 1 / -1; margin-top: 8px; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--warn); }
  .slot .cfm button { min-height: 36px; min-width: 0; padding: 0 14px; font-size: 13px; background: var(--warn); border-color: var(--warn); color: #1a1300; grid-row: auto; grid-column: auto; }
  .crew .contact { margin-top: 14px; font-size: 14px; color: var(--dim); }
  .crew .contact a { color: var(--ok); }
  .crew .msg { min-height: 20px; font-size: 14px; margin: 4px 0 8px; }
  @media print { body { background: #fff; } .actions, .hint, .top, .crew { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../">← TAKT NR. 30</a><span class="mono dim" id="orderNo" style="font-size:12px"></span></div>
  <div id="box" aria-live="polite"><p class="muted">Lädt …</p></div>
  <p class="hint" id="hint" hidden>Tipp: Speichere diese Seite auf deinem Home-Bildschirm oder als PDF – dann hast du dein Ticket am Eingang sofort griffbereit.</p>
</div>
<script src="/taktnr30/assets/vendor/qrcode.js"></script>
<script src="/taktnr30/assets/takt.js?v=2"></script>
<script defer src="/taktnr30/assets/vendor/jspdf.umd.min.js"></script>
<script>
(function () {
  "use strict";
  const { api, esc, $, dateDe, timeDe, qrSvg, qrMatrix, store, categoryLabel, guestName } = TAKT;
  const q = new URLSearchParams(location.search);
  const k = q.get("k"), o = q.get("o"), ks = (q.get("ks") || "").split(",").filter(Boolean).slice(0, 40);
  let tickets = [], event = null, order = null;

  function remember(entry) {
    const list = store.get("mine", []).filter(x => !(x.type === entry.type && x.key === entry.key));
    list.unshift(entry); store.set("mine", list.slice(0, 10));
  }

  function card(t, i) {
    const name = guestName(t);
    let flag = "";
    if (t.status === "blocked") flag = `<div class="flag bad">GESPERRT</div>`;
    else if (t.status === "cancelled") flag = `<div class="flag bad">STORNIERT</div>`;
    else if (t.checked_in_at) flag = `<div class="flag in">EINGECHECKT</div>`;
    else if (t.is_test) flag = `<div class="flag test">TEST</div>`;
    const void_ = t.status !== "valid";
    return `<article class="ticket cat-${esc(t.category)} ${void_ ? "void" : ""}" aria-label="Ticket ${esc(t.number)}">
      ${flag}
      <img class="logo" src="/taktnr30/assets/logo.svg" alt="" width="64" height="64">
      <img class="wm" src="/taktnr30/assets/wordmark.svg" alt="TAKT Nr. 30" width="190" height="28">
      <div class="qrwrap"><div class="qr">${qrSvg("T30." + t.code, { label: `QR-Code für Ticket ${t.number}` })}</div></div>
      <div class="name">${esc(name)}</div>
      <dl class="grid">
        <div><dt>TICKET</dt><dd>${esc(t.number)}</dd></div>
        <div><dt>KATEGORIE</dt><dd class="uv">${esc(categoryLabel(t))}</dd></div>
        <div><dt>DATUM</dt><dd>${esc(dateDe(event.event_date))}</dd></div>
        <div><dt>EINLASS · START</dt><dd>${esc(event.doors_time)} · ${esc(event.start_time)}</dd></div>
        <div class="addr"><dt>ORT</dt><dd>${esc(event.venue_name)}<br>${/\d/.test(event.venue_address) ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.venue_address)}" rel="noopener" target="_blank">${esc(event.venue_address)}</a>` : esc(event.venue_address)}</dd></div>
        ${t.tier === "vip" && t.drinks ? `<div class="addr"><dt>VIP</dt><dd class="uv">Lila VIP-Bändchen, Begrüßungsshot + ${+t.drinks} Getränkemarken am Einlass</dd></div>` : ""}
        ${t.category === "helper" ? `<div class="addr"><dt>CREW</dt><dd style="color:var(--ok)">${+t.drinks || 5} Getränkemarken + TAKT-Becher am Einlass · Wasser gratis</dd></div>` : ""}
        ${t.checked_in_at ? `<div class="addr"><dt>EINGECHECKT</dt><dd>${esc(dateDe(t.checked_in_at))} ${esc(timeDe(t.checked_in_at))}</dd></div>` : ""}
      </dl>
      <div class="stub"></div>
      <div class="stubtext">Einmalig gültig · persönlich · ab 18 · Ausweis mitbringen</div>
    </article>`;
  }

  function render() {
    $("#box").innerHTML = `<div class="tickets">${tickets.map(card).join("")}</div>
      <div class="actions">
        <button class="btn btn-uv btn-block" id="pdf">${tickets.length > 1 ? "Tickets als PDF speichern" : "Als PDF speichern"}</button>
        ${k && !o && q.get("ansicht") !== "admin" ? `<button class="lnk" id="forget" style="background:none;border:0;color:var(--dim);font-size:13px;text-decoration:underline;cursor:pointer;justify-self:center">Nicht dein Ticket? Von diesem Gerät entfernen</button>` : ""}
        ${order ? `<button class="btn btn-block" id="resend">Erneut per E-Mail senden</button><p class="note" id="mailInfo" style="text-align:center;margin:0">${order.mail_status === "sent" ? `Per E-Mail an ${esc(order.email)} geschickt.` : order.mail_status === "failed" ? "Die E-Mail konnte noch nicht verschickt werden – dein Ticket ist trotzdem gültig." : ""}</p>` : ""}
      </div>`;
    $("#hint").hidden = false;
    if (tickets.length === 1 && tickets[0].category === "helper" && k) loadShifts();
    $("#pdf").onclick = () => pdf().catch(e => alert("PDF konnte nicht erstellt werden: " + e.message));
    if ($("#forget")) $("#forget").onclick = () => {
      if (!confirm("Dieses Ticket von diesem Gerät entfernen? Das Ticket selbst bleibt gültig.")) return;
      store.set("mine", store.get("mine", []).filter(x => !(x.type === "ticket" && x.key === k)));
      location.href = "../";
    };
    if (order) $("#resend").onclick = async () => {
      const b = $("#resend"); b.disabled = true;
      try { const r = await api("/public/order/resend", { method: "POST", body: { access_key: o } }); $("#mailInfo").textContent = r.mail_status === "sent" ? `Gesendet an ${order.email}.` : "Versand gerade nicht möglich – bitte später erneut versuchen."; }
      catch (e) { $("#mailInfo").textContent = e.message; }
      b.disabled = false;
    };
  }

  /* ---- Schichtwahl für Helfer ---- */
  let shiftBusy = false;
  const span = sh => `${sh.starts} – ${sh.ends || "Ende"}`;
  const WHY = { voll: "Voll", max: "Wechseln", pause: "Zu knapp" };
  async function loadShifts(data) {
    let host = $("#schichten");
    if (!host) { $("#box").insertAdjacentHTML("beforeend", `<section class="crew" id="schichten" aria-live="polite"><p class="muted">Schichten laden …</p></section>`); host = $("#schichten"); }
    try { data = data || await api(`/public/shifts?k=${encodeURIComponent(k)}`); }
    catch (e) { host.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    renderShifts(host, data);
    if (location.hash === "#schichten" && !host.dataset.scrolled) { host.dataset.scrolled = "1"; setTimeout(() => host.scrollIntoView({ behavior: "smooth", block: "start" }), 150); }
  }
  function renderShifts(host, v) {
    const mine = v.shifts.filter(s => s.mine), done = mine.length >= v.max;
    const groups = [...new Set(v.shifts.map(s => s.spot || v.area))];
    // Bei genau einer Schicht: nach der Wahl kann man direkt wechseln (statt erst austragen)
    const swapFrom = v.max === 1 && mine.length === 1 ? mine[0].id : null;
    const slot = s => {
      const swap = s.why === "max" && swapFrom && s.free > 0;
      const off = !s.mine && ((!!s.why && !swap) || !v.open);
      const btn = s.mine ? (v.open && !v.drop_locked ? `<button data-drop="${s.id}" aria-label="Aus ${esc(span(s))} austragen">Austragen</button>` : "")
        : `<button class="${swap ? "" : "take"}" data-take="${s.id}" ${swap ? `data-swap="${swapFrom}"` : ""} ${off ? "disabled" : ""} aria-label="${esc(span(s))} ${swap ? "wechseln" : "nehmen"}">${s.why ? WHY[s.why] : "Nehmen"}</button>`;
      const who = s.crew.length ? `mit <span class="who">${s.crew.map(esc).join(", ")}</span>` : "noch niemand";
      return `<div class="slot ${s.mine ? "mine" : ""} ${off || swap ? "off" : ""}">
        <div class="t">${esc(span(s))}</div>${btn}
        <div class="w">${s.free ? `${s.free} von ${s.slots} frei` : "voll"} · ${who}${s.note ? " · " + esc(s.note) : ""}</div>
        <div class="bar" aria-hidden="true">${Array.from({ length: s.slots }, (_, i) => `<i class="${i < s.taken ? "on" : ""}"></i>`).join("")}</div>
        ${s.mine && !s.committed ? `<div class="cfm"><span>Kim hat dich eingeteilt – bitte bestätigen.</span><button data-confirm="${s.id}">Zusagen</button></div>` : ""}
      </div>`;
    };
    host.innerHTML = `<h2>${v.max > 1 ? "Deine Schichten" : "Deine Schicht"}</h2>
      <p class="lead">${v.max > 1 ? `Such dir <b>${v.max} Schichten</b> aus – nie direkt hintereinander, damit du dazwischen feiern kannst.` : "Such dir <b>eine Schicht</b> aus (rund 3 Stunden). Den Rest der Nacht feierst du mit."}${v.info ? " " + esc(v.info) : ""}</p>
      <div class="perk"><span>Dafür ist dein <b>Eintritt frei</b>, du bekommst <b>5 Getränkemarken und deinen eigenen TAKT-Becher</b> – Wasser gibt’s den ganzen Abend gratis.</span></div>
      <label class="commit ${mine.length && mine.every(x => x.committed) ? "done" : ""}" id="commitBox"><input type="checkbox" id="commitChk" ${mine.length && mine.every(x => x.committed) ? "checked disabled" : ""}><span><b>Verbindliche Zusage:</b> ${esc(v.commit_text)}</span></label>
      <div class="count"><span>${esc(v.area.toUpperCase())}</span><span><b>${mine.length}</b> / ${v.max} gewählt</span></div>
      <p class="msg" id="shiftMsg">${!v.open ? '<span class="dim">Die Schichtwahl ist geschlossen. Änderungen bitte direkt mit Kim.</span>' : done ? '<span style="color:var(--ok)">Perfekt, du bist eingetragen. Danke!</span>' : ""}</p>
      ${v.shifts.length ? groups.map(g => `${groups.length > 1 ? `<div class="grp">${esc(g.toUpperCase())}</div>` : ""}${v.shifts.filter(s => (s.spot || v.area) === g).map(slot).join("")}`).join("") : '<p class="muted">Für deine Aufgabe steht noch kein Schichtplan. Kim meldet sich.</p>'}`;
    host.insertAdjacentHTML("beforeend", `<p class="contact">${v.drop_locked ? `Austragen geht jetzt nur noch telefonisch.` : `Austragen kannst du dich selbst bis ${esc(v.drop_until.split("-").reverse().join("."))}.`} Kannst du nicht oder hast Fragen? <a href="tel:${esc(v.contact.replace(/\s/g, ""))}">${esc(v.contact)}</a></p>`);
    const rc = v.recruit;
    if (rc && rc.url && rc.open) {
      host.insertAdjacentHTML("beforeend", `<div class="recruit"><h3>Wir suchen noch Helfer</h3>
        <p>Du kennst Leute, die auch helfen würden? Schick ihnen deinen Helfer-Link. Darüber können sie sich nur als Helfer eintragen – Tickets gibt es darüber nicht.</p>
        <div class="row"><button class="btn btn-block" id="rcShare" style="background:var(--ok);border-color:var(--ok);color:#04210f">Link teilen</button><button class="btn" id="rcCopy" aria-label="Link kopieren">Kopieren</button></div>
        <small>NOCH ${+rc.available} HELFERPLÄTZE FREI${rc.brought ? ` · ÜBER DEINEN LINK: ${+rc.brought}` : ""}</small></div>`);
      const text = `Hey, ich helfe bei TAKT Nr. 30 mit – hast du Lust auch? Eine Schicht (rund 3 Stunden), dafür Eintritt frei, 5 Getränkemarken und ein TAKT-Becher. Hier eintragen:`;
      $("#rcShare").onclick = async () => {
        if (navigator.share) { try { await navigator.share({ title: "Helfer für TAKT Nr. 30", text, url: rc.url }); return; } catch (e) { if (e.name === "AbortError") return; } }
        window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + rc.url)}`, "_blank", "noopener");
      };
      $("#rcCopy").onclick = async () => { try { await navigator.clipboard.writeText(rc.url); $("#rcCopy").textContent = "Kopiert ✓"; } catch { prompt("Zum Kopieren:", rc.url); } };
    }
    host.querySelectorAll("[data-take],[data-drop]").forEach(b => b.onclick = () => {
      if (b.dataset.take && !$("#commitChk").checked) {   // erst Zusage, dann Schicht
        const box = $("#commitBox"); box.classList.add("need"); box.scrollIntoView({ behavior: "smooth", block: "center" });
        $("#shiftMsg").innerHTML = '<span style="color:var(--warn)">Bitte zuerst die Zusage oben ankreuzen.</span>'; return;
      }
      pick(host, +(b.dataset.take || b.dataset.drop), !!b.dataset.take, b.dataset.swap ? +b.dataset.swap : undefined);
    });
    host.querySelectorAll("[data-confirm]").forEach(b => b.onclick = () => pick(host, +b.dataset.confirm, null, undefined, true));
    $("#commitChk").onchange = () => $("#commitBox").classList.remove("need");
  }
  async function pick(host, id, take, replace, confirmOnly) {
    if (shiftBusy) return; shiftBusy = true;
    host.querySelectorAll("button").forEach(b => b.disabled = true);
    const body = confirmOnly ? { k, shift_id: id, confirm: true } : { k, shift_id: id, take, replace, commit: take ? true : undefined };
    try { renderShifts(host, await api("/public/shifts", { method: "POST", body })); }
    catch (e) { await loadShifts(); const m = $("#shiftMsg"); if (m) m.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    shiftBusy = false;
  }

  // SVG → PNG für das PDF
  function raster(src, w) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { const c = document.createElement("canvas"); c.width = w; c.height = Math.round(w * img.naturalHeight / img.naturalWidth); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); resolve({ data: c.toDataURL("image/png"), ratio: c.height / c.width }); };
      img.onerror = reject; img.src = src;
    });
  }

  async function pdf() {
    if (!window.jspdf) throw new Error("wird noch geladen – bitte kurz erneut tippen");
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "mm", format: [105, 180] });
    const logo = await raster("/taktnr30/assets/logo.svg", 600), wm = await raster("/taktnr30/assets/wordmark.svg", 1200);
    tickets.forEach((t, i) => {
      if (i) doc.addPage([105, 180]);
      doc.setFillColor(10, 10, 12); doc.rect(0, 0, 105, 180, "F");
      doc.addImage(logo.data, "PNG", 40, 10, 25, 25);
      doc.addImage(wm.data, "PNG", 22.5, 40, 60, 60 * wm.ratio);
      // QR
      const m = qrMatrix("T30." + t.code), n = m.length, size = 52, cell = size / (n + 4), x0 = (105 - size) / 2, y0 = 60;
      doc.setDrawColor(157, 77, 255); doc.setLineWidth(0.3); doc.circle(52.5, y0 + size / 2, size / 2 + 8, "S");
      doc.setFillColor(255, 255, 255); doc.roundedRect(x0, y0, size, size, 1.5, 1.5, "F");
      doc.setFillColor(0, 0, 0);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) doc.rect(x0 + (x + 2) * cell, y0 + (y + 2) * cell, cell + 0.02, cell + 0.02, "F");
      doc.setTextColor(242, 242, 244); doc.setFont("helvetica", "normal"); doc.setFontSize(16);
      doc.text(guestName(t), 52.5, 133, { align: "center" });
      const lab = (l, v, x, y) => { doc.setFontSize(6.5); doc.setTextColor(130, 130, 142); doc.text(l, x, y); doc.setFontSize(9.5); doc.setTextColor(242, 242, 244); doc.text(v, x, y + 4.5); };
      lab("TICKET", t.number, 14, 141); lab("KATEGORIE", categoryLabel(t), 56, 141);
      lab("DATUM", dateDe(event.event_date), 14, 151); lab("EINLASS · START", `${event.doors_time} · ${event.start_time}`, 56, 151);
      doc.setFontSize(6.5); doc.setTextColor(130, 130, 142); doc.text("ORT", 14, 161); doc.setFontSize(8.5); doc.setTextColor(242, 242, 244); doc.text([event.venue_name, event.venue_address], 14, 165);
      doc.setFontSize(6.5); doc.setTextColor(180, 180, 190); doc.text("EINMALIG GÜLTIG · PERSÖNLICH · AB 18 · AUSWEIS MITBRINGEN" + (t.is_test ? " · TESTTICKET" : ""), 52.5, 176, { align: "center" });
    });
    doc.save(tickets.length > 1 ? "TAKT-Nr-30-Tickets.pdf" : `TAKT-Nr-30-${tickets[0].number}.pdf`);
  }

  async function load() {
    try {
      if (o) {
        order = await api(`/public/order?key=${encodeURIComponent(o)}`);
        $("#orderNo").textContent = order.order_no;
        if (order.status === "pending") { $("#box").innerHTML = `<h2 style="font-weight:300">Zahlung noch nicht abgeschlossen.</h2><p class="muted">Sobald die Zahlung bestätigt ist, erscheinen deine Tickets hier. Seite lädt automatisch neu.</p>`; setTimeout(load, 5000); return; }
        if (order.status !== "paid") { $("#box").innerHTML = `<h2 style="font-weight:300">Für diese Bestellung gibt es keine gültigen Tickets.</h2><p class="muted">${order.status === "refund_required" || order.status === "refunded" ? "Das letzte Ticket war leider schon vergeben – du bekommst dein Geld vollständig zurück." : "Die Bestellung wurde abgebrochen. Es wurde nichts abgebucht."}</p>`; return; }
        remember({ type: "order", key: o });
        tickets = order.tickets; event = order.event;
      } else if (ks.length) {
        // Sammelansicht (z. B. alle 2TAKT-Freitickets) – wird nicht auf dem Gerät gemerkt
        $("#box").innerHTML = `<p class="muted">Lädt ${ks.length} Tickets …</p>`;
        for (const key of ks) { const t = await api(`/public/ticket?k=${encodeURIComponent(key)}`); tickets.push(t); event = t.event; }
        $("#orderNo").textContent = `${tickets.length} TICKETS`;
      } else if (k) {
        const t = await api(`/public/ticket?k=${encodeURIComponent(k)}`);
        if (q.get("ansicht") === "admin") $(".top").insertAdjacentHTML("afterend", `<p style="max-width:380px;margin:-8px auto 18px;padding:10px 14px;border:1px solid var(--uv);border-radius:10px;background:var(--uv-deep);font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-align:center">ADMIN-ANSICHT · WIRD AUF DIESEM GERÄT NICHT GESPEICHERT</p>`);
        else remember({ type: "ticket", key: k });
        tickets = [t]; event = t.event;
      } else { $("#box").innerHTML = `<p class="muted">Kein Ticket angegeben.</p>`; return; }
      render();
    } catch (e) {
      $("#box").innerHTML = `<p class="err">${esc(e.message)}</p>${e.status === 0 ? `<button class="btn" onclick="location.reload()">Erneut versuchen</button>` : ""}`;
    }
  }
  load();
})();
</script>
</body>
</html>
